<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      読み込むのは同一ディレクトリ内のファイルのみ。
      default-src 'none' + connect-src 'self' で外部との通信を遮断しているため、
      万一データに不正な文字列が混入しても外部送信は成立しない。
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>アイマス キャラクターカラー当て</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- データ本体（build_db.py が生成）→ アプリ本体 の順に読み込む -->
    <script src="data/imas_colors.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>

    <div id="statusMessage" class="panel">読み込み中...</div>

    <div id="colorInfo" class="panel">
        <div id="nameLabel" class="name-label"></div>
        <div id="cvLabel" class="cv-label"></div>
        <div class="meta-row">
            <span id="answerSwatch" class="swatch"></span>
            <span id="hexLabel" class="hex-label"></span>
            <span id="brandLabel" class="brand-label"></span>
        </div>
        <div id="noteLabel" class="note-label"></div>
    </div>

    <!-- 左上に縦積み。右下はヒントボタン、右上は設定ボタンが占めるため。 -->
    <div id="topLeft">
        <div id="clickHint">画面クリック(タップ)で回答を表示</div>
        <!-- データ参照元の表記（内容は data/imas_colors.js の credit から描画） -->
        <div id="creditContainer"></div>
    </div>

    <div id="hintContainer">
        <button id="hint1Button" type="button">ヒント1</button>
        <button id="hint2Button" type="button">ヒント2</button>
        <button id="hint3Button" type="button">ヒント3</button>
    </div>

    <button id="settingsButton" type="button" title="設定">⚙<span class="sr-only">設定</span></button>

    <div id="modalOverlay" class="overlay">
        <div class="modal-content">
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <div id="settingsOverlay" class="overlay">
        <div id="settingsPanel">
            <h2>出題範囲</h2>
            <div id="brandGrid" class="brand-grid"></div>
            <div class="option-row">
                <label><input type="checkbox" id="includeUnits"> ユニット・グループも出題する</label>
            </div>
            <div class="settings-actions">
                <button type="button" id="selectAllButton">すべて選択</button>
                <button type="button" id="selectNoneButton">すべて解除</button>
                <span class="spacer"></span>
                <button type="button" id="closeSettingsButton">閉じる</button>
            </div>
            <div id="settingsSummary" class="settings-note"></div>
            <div id="settingsCredit" class="settings-note"></div>
        </div>
    </div>

</body>
</html>
